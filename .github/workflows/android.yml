# Sestaví Android aplikaci Kuchapka (tenhle web zabalený do aplikace) a vydá ji na stálé adrese:
# https://github.com/zarybjir/Kuchapka/releases/download/kuchapka-latest/kuchapka.apk
name: Build Android APK

on:
  push:
    branches: [main, ccr-63ee96b3-7bf2sa]
    paths:
      - "android/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "manifest.json"
      - "icon-192.png"
      - "icon-512.png"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore
        env:
          KS_B64: ${{ secrets.PANEL_KEYSTORE_B64 }}
        run: |
          # Bez stálého klíče by se APK podepsala náhodným klíčem a přes nainstalovanou
          # verzi by nešla nainstalovat — radši nevydat nic.
          if [ -z "$KS_B64" ]; then
            echo "::error title=Chybí podpisový klíč::Přidej secrets PANEL_KEYSTORE_B64 a PANEL_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/panel.keystore"
          echo "PANEL_KEYSTORE=$RUNNER_TEMP/panel.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          PANEL_KEYSTORE_PASSWORD: ${{ secrets.PANEL_KEYSTORE_PASSWORD }}
        run: |
          echo "Web: $(grep -o 'build [0-9]*' ../index.html | head -1)"
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --console=plain assembleDebug > build.log 2>&1
          rc=$?
          set -e
          cat build.log
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Could not|> |FAILURE|Caused by" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
            exit $rc
          fi

      - name: Publish
        run: |
          # Starší sestavení, které doběhlo později, nesmí přepsat novější verzi.
          head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
            echo "Na větvi je novější commit ($head), vydání přeskakuji."
            exit 0
          fi
          cp build/outputs/apk/debug/kuchapka-debug.apk kuchapka.apk
          code=$(grep -o 'versionCode = [0-9]*' build.gradle.kts | grep -o '[0-9]*')
          echo "versionCode=$code" > version.txt
          gh release list --limit 50 --json tagName,name \
            --jq '.[] | select(.name | startswith("Kuchapka")) | .tagName' |
            while read -r t; do gh release delete "$t" --yes || true; done
          git push -f origin "$GITHUB_SHA:refs/tags/kuchapka-latest"
          gh release create kuchapka-latest kuchapka.apk version.txt --prerelease --verify-tag \
            --title "Kuchapka pro Android (nejnovější)" \
            --notes "Automaticky sestaveno z $GITHUB_SHA."
        env:
          GH_TOKEN: ${{ github.token }}
